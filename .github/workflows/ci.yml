name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.cxx }}${{ matrix.asan && ', asan' || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++-14, clang++-19]
        # The sanitizer executables build in their own job, in parallel with the plain one.
        asan: [false, true]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        if [[ "${{ matrix.cxx }}" == clang++-19 ]]; then
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
        fi
        sudo apt-get install -y ${{ matrix.cxx }} cmake libeigen3-dev python3-numpy python3-matplotlib # Eigen 3.4 from the Ubuntu archive, not a clone from gitlab.com

    - name: Configure
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
          -DNUMSIM_MATERIALS_BUILD_TESTS=ON \
          -DNUMSIM_SANITIZER_TESTS=${{ matrix.asan && 'ON' || 'OFF' }} \
          -DNUMSIM_MATERIALS_BUILD_REPORTS=${{ matrix.asan && 'OFF' || 'ON' }} \
          -DNUMSIM_MATERIALS_REPORT_TESTS=${{ matrix.asan && 'OFF' || 'ON' }} \
          -DNUMSIM_MATERIALS_BUILD_EXAMPLES=OFF \
          -DNUMSIM_MATERIALS_ENABLE_PLOTTING=OFF \
          -DNUMSIM_MATERIALS_DEBUG_CHECKS=ON

    - name: Build
      run: cmake --build build -j$(nproc) ${{ matrix.asan && '--target numsim_materials_asan_tests' || '' }}

    - name: Test
      run: cd build && ctest --output-on-failure -j$(nproc) ${{ matrix.asan && '-R _asan$' || '' }}
