name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The NumSim stack's baseline is GCC 13 / Clang 18 (libstdc++ 13):
        # std::expected comes from core/expected.h's tl::expected fallback there.
        cxx: [g++-13, g++-14, clang++-18]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.cxx }} cmake

    - name: Configure
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
          -DNUMSIM_BUILD_TESTS=ON \
          -DNUMSIM_BUILD_EXAMPLES=OFF \
          -DENABLE_PLOTTING=OFF

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Test
      run: cd build && ctest --output-on-failure
