name: CI

on:
  push:
    branches: [main]
  # No branch filter: work lands through stacks of PRs that target a feature
  # branch rather than main, and a base-branch filter meant none of them was
  # ever built or tested here.
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-14 cmake

    - name: Configure
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER=g++-14 \
          -DNUMSIM_BUILD_TESTS=ON \
          -DNUMSIM_BUILD_EXAMPLES=OFF \
          -DENABLE_PLOTTING=OFF

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Test
      run: cd build && ctest --output-on-failure
