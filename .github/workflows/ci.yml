name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++-13, g++-14, clang++-19]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        if [[ "${{ matrix.cxx }}" == clang++-19 ]]; then
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
        fi
        sudo apt-get install -y ${{ matrix.cxx }} cmake

    - name: Configure
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
          -DNUMSIM_MATERIALS_BUILD_TESTS=ON \
          -DNUMSIM_MATERIALS_BUILD_EXAMPLES=OFF \
          -DNUMSIM_MATERIALS_ENABLE_PLOTTING=OFF

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Test
      run: cd build && ctest --output-on-failure
